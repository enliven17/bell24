<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,800;100,900&display=block" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #d9ebf2; padding: 40px; width: 1520px; font-family: Archivo; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
  .c { height: 300px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 18px; position: relative; }
  .l { background: #F8FCFD; color: #002941; }
  .d { background: #002941; color: #F8FCFD; }
  .w { font: 800 60px Archivo; font-stretch: 100%; letter-spacing: -0.035em; }
  .t { position: absolute; left: 18px; top: 14px; font: 700 14px Archivo; color: #7d97a5; }
</style>
</head>
<body>
<div id="r"></div>
<script>
const N = '#002941', C = '#FD6E6E', P = '#F8FCFD'
// v: notch corner (x where the notch starts, y where it starts), radius of inner curve
const mark = (v, fg, ink, size) => {
  const { nx, ny, r } = v
  const tile = `M14 2H62V${ny - r}a${r} ${r} 0 0 1-${r} ${r}H${nx + r}a${r} ${r} 0 0 0-${r} ${r}V${62 - r}a${r} ${r} 0 0 1-${r} ${r}H2V14A12 12 0 0 1 14 2z`
  const g = 4 // gap between tile and coral block
  const bx = nx + g, by = ny + g
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64">
    <path d="${tile}" fill="${fg}"/>
    <rect x="${bx}" y="${by}" width="${62 - bx}" height="${62 - by}" rx="6" fill="${C}"/>
    <text x="${(bx + 62) / 2}" y="${by + (62 - by) / 2 + v.fs * 0.36}" text-anchor="middle" font-family="Archivo" font-weight="900" font-size="${v.fs}" letter-spacing="-0.6" fill="${N}">24</text>
    <text x="${v.bx}" y="${v.by}" text-anchor="middle" font-family="Archivo" font-weight="900" font-size="${v.bs}" fill="${ink}">b</text>
  </svg>`
}
const V = [
  { nx: 26, ny: 36, r: 7, fs: 17, bx: 15, by: 33, bs: 30 },
  { nx: 22, ny: 32, r: 7, fs: 20, bx: 13, by: 29, bs: 28 },
  { nx: 30, ny: 38, r: 6, fs: 15, bx: 17, by: 35, bs: 32 },
]
document.getElementById('r').innerHTML = V.map((v, i) => `
  <div class="row">
    <div class="c l"><span class="t">${'ABC'[i]}</span>${mark(v, N, P, 200)}</div>
    <div class="c l">${mark(v, N, P, 72)}<span class="w">bell24</span></div>
    <div class="c d">${mark(v, P, N, 72)}<span class="w">bell24</span></div>
  </div>`).join('') + `<div class="row">${V.map((v) => `<div class="c l" style="height:120px">${mark(v, N, P, 32)}${mark(v, N, P, 20)}${mark(v, N, P, 16)}</div>`).join('')}</div>`
</script>
</body>
</html>
