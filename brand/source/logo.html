<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>body{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden}
.icon{width:100vw;height:100vh;background:#002941;display:grid;place-items:center}
.icon svg{width:64%;height:64%}</style></head>
<body><script type="module">
import { markSvg, lockup } from './parts.js'
const q = new URLSearchParams(location.search)
const k = q.get('k'), t = q.get('t') ?? 'color'
if (k === 'mark') document.body.innerHTML = markSvg(t, Math.min(innerWidth, innerHeight))
else if (k === 'icon') document.body.innerHTML = `<div class="icon">${markSvg('paper')}</div>`
else document.body.innerHTML = lockup(t, innerHeight * 0.46)
</script></body></html>
